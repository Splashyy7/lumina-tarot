<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1338"/>
      <stop offset="60%" stop-color="#0E0924"/>
      <stop offset="100%" stop-color="#070A18"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Sacred Geometry Ring -->
  <circle cx="256" cy="256" r="210" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" stroke="url(#purpleGlow)" stroke-width="1.5" opacity="0.4"/>

  <!-- Rotating Diamond Frame -->
  <polygon points="256,70 442,256 256,442 70,256" stroke="url(#goldGrad)" stroke-width="4" fill="none" opacity="0.8" filter="url(#glow)"/>
  <polygon points="256,105 407,256 256,407 105,256" stroke="url(#purpleGlow)" stroke-width="2" fill="#120A2E" fill-opacity="0.6"/>

  <!-- Central Eight-Pointed Celestial Star -->
  <g filter="url(#glow)">
    <!-- Main 4 Points -->
    <polygon points="256,120 274,238 392,256 274,274 256,392 238,274 120,256 238,238" fill="url(#goldGrad)"/>
    <!-- Diagonal 4 Points -->
    <polygon points="256,170 268,244 342,256 268,268 256,342 244,268 170,256 244,244" fill="url(#goldGrad)" opacity="0.75" transform="rotate(45 256 256)"/>
  </g>

  <!-- Eye of Providence / Core Light -->
  <circle cx="256" cy="256" r="28" fill="#FFFBEB" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#F59E0B"/>
  <circle cx="256" cy="256" r="5" fill="#451A03"/>

  <!-- Sacred Dots on Cardinal Axes -->
  <circle cx="256" cy="50" r="6" fill="url(#goldGrad)"/>
  <circle cx="256" cy="462" r="6" fill="url(#goldGrad)"/>
  <circle cx="50" cy="256" r="6" fill="url(#goldGrad)"/>
  <circle cx="462" cy="256" r="6" fill="url(#goldGrad)"/>
</svg>
